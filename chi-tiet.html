<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Chi tiết sản phẩm - IN3D Shop</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" type="image/png" href="assets/logo/logo.png">
    <link rel="apple-touch-icon" href="assets/logo/logo.png">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/22a24d17be.js" crossorigin="anonymous"></script>
    <link href="assets/css/order.css?v=10" rel="stylesheet">
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; font-family: 'Chakra Petch', sans-serif; }
        body { background-color: #eee; }

        .dau-trang {
            background-color: #151720;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .dau-trang a { color: #fff; text-decoration: none; }
        .dau-trang a:hover { color: #a3ff12; }
        .dau-trang .logo img { height: 56px; vertical-align: middle; }
        .dau-trang nav { display: flex; gap: 18px; flex-wrap: wrap; }

        .khung {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 16px;
        }
        .duong-dan { color: #666; font-size: 14px; margin-bottom: 16px; }
        .duong-dan a { color: #4c8a00; text-decoration: none; }

        .chi-tiet {
            display: flex;
            gap: 30px;
            background: #fff;
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
            flex-wrap: wrap;
        }
        .chi-tiet .anh {
            flex: 1 1 380px;
            min-width: 280px;
        }
        /* SLIDE ẢNH: ảnh lớn trượt ngang + nút trái/phải + chấm + dải ảnh nhỏ bên dưới */
        .slide { position: relative; border-radius: 12px; overflow: hidden; background: #f4f5f6; }
        .slide-khung { display: flex; transition: transform .45s ease; }
        .slide-khung img {
            flex: 0 0 100%; width: 100%; height: 380px; object-fit: cover; display: block;
            user-select: none; -webkit-user-drag: none;
        }
        .slide-nut {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
            background: rgba(21, 23, 32, .55); color: #fff; font-size: 16px;
            display: flex; align-items: center; justify-content: center; transition: background .2s;
        }
        .slide-nut:hover { background: rgba(21, 23, 32, .85); }
        .slide-nut.trai { left: 10px; }
        .slide-nut.phai { right: 10px; }
        .slide-cham {
            position: absolute; left: 0; right: 0; bottom: 10px;
            display: flex; justify-content: center; gap: 6px;
        }
        .slide-cham button {
            width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
            background: rgba(255, 255, 255, .6); transition: width .2s;
        }
        .slide-cham button.dang-xem { background: #fff; width: 22px; border-radius: 6px; }
        .dai-anh { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
        .dai-anh img {
            width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: pointer;
            border: 2px solid transparent; opacity: .65; flex-shrink: 0; transition: opacity .2s;
        }
        .dai-anh img.dang-xem { border-color: #a3ff12; opacity: 1; }
        @media (prefers-reduced-motion: reduce) { .slide-khung { transition: none; } }
        .chi-tiet .noi-dung { flex: 1 1 380px; min-width: 280px; }
        .chi-tiet h1 { font-size: 30px; line-height: 1.25; margin-bottom: 8px; }
        .nhan-danh-muc {
            display: inline-block;
            background: #eef7df;
            color: #4c8a00;
            border-radius: 20px;
            font-size: 13px;
            padding: 3px 12px;
            margin-bottom: 12px;
        }
        .gia-lon { color: #4c8a00; font-size: 34px; margin: 10px 0; }
        /* Đang giảm giá: giá gốc gạch ngang + nhãn % cạnh giá khách phải trả (giống thẻ trang chủ) */
        .gia-lon .gia-goc { color: #9a9a9a; font-size: 20px; text-decoration: line-through; margin-left: 8px; }
        .gia-lon .nhan-giam {
            display: inline-block; vertical-align: middle; margin-left: 6px;
            background: #e03131; color: #fff; font-size: 14px; padding: 3px 10px; border-radius: 999px;
        }
        .ton-kho { font-size: 15px; margin-bottom: 14px; }
        .ton-kho .con { color: #2e7d32; }
        .ton-kho .het { color: #c62828; }
        .mo-ta { color: #555; font-size: 15px; line-height: 1.65; margin-bottom: 18px; white-space: pre-wrap; }

        /* Vài dòng thông số lấy thẳng từ database; thiếu ô nào thì giấu dòng đó */
        .bang-tt { margin-bottom: 22px; }
        .dong-tt {
            display: flex; justify-content: space-between; align-items: center; gap: 14px;
            padding: 9px 0; border-bottom: 1px solid #eef0f2; font-size: 14.5px;
        }
        .dong-tt:last-child { border-bottom: none; }
        .dong-tt .nhan-tt { color: #777; }
        .chip-mau {
            display: inline-flex; align-items: center; gap: 6px;
            background: #f4f5f6; border-radius: 20px; padding: 3px 11px 3px 5px;
            font-size: 13px; margin-left: 4px;
        }
        .chip-mau i {
            width: 13px; height: 13px; border-radius: 4px;
            border: 1px solid rgba(0,0,0,.18); display: inline-block;
        }

        .hang-nut { display: flex; gap: 12px; flex-wrap: wrap; }
        .nut {
            border: none;
            border-radius: 8px;
            padding: 13px 26px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Chakra Petch', sans-serif;
            transition: 0.2s;
        }
        .nut-gio { background: #151720; color: #a3ff12; }
        .nut-gio:hover { background: #000; }
        .nut-mua { background: #a3ff12; color: #151720; }
        .nut-mua:hover { background: #8ede00; }

        .goi-y { margin-top: 34px; }
        .goi-y h2 { font-size: 22px; margin-bottom: 14px; }
        .luoi-goi-y { display: flex; gap: 16px; flex-wrap: wrap; }
        .the-goi-y {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            width: 240px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.07);
            text-decoration: none;
            color: #222;
            transition: 0.2s;
        }
        .the-goi-y:hover { transform: translateY(-4px); }
        .the-goi-y img { width: 100%; height: 130px; object-fit: cover; }
        .the-goi-y .t { padding: 10px 12px 4px 12px; font-size: 14px; line-height: 1.35; }
        .the-goi-y .g { padding: 0 12px 12px 12px; color: #4c8a00; font-size: 15px; }

        .trang-thai-tai { text-align: center; color: #888; padding: 40px 0; }

        @media (max-width: 700px) {
            .slide-khung img { height: 260px; }
            .chi-tiet h1 { font-size: 22px; }
            .gia-lon { font-size: 26px; }
        }

        * { font-weight: 700 !important; }
    </style>
    <link href="assets/css/anime.css?v=1" rel="stylesheet">
</head>
<body>

    <header class="dau-trang">
        <a class="logo" href="index.html"><img src="assets/logo/logo.png" alt="IN3D Shop"></a>
        <nav class="nav-bar-home-page" style="margin:0;">
            <ul style="display:flex; gap:4px; list-style:none; margin:0; padding:0;">
                <li><a href="Home.html" style="padding:9px 12px;">TRANG CHỦ</a></li>
                <li><a href="san-pham.html" style="padding:9px 12px;">SẢN PHẨM</a></li>
            </ul>
        </nav>
    </header>

    <div class="khung">
        <p class="duong-dan"><a href="Home.html">Trang chủ</a> › <a href="san-pham.html">Sản phẩm</a> › <span id="dd-ten">Chi tiết</span></p>

        <div id="noi-dung-chinh" class="trang-thai-tai">Đang tải thông tin sản phẩm...</div>

        <div class="goi-y" id="khu-goi-y" style="display:none;">
            <h2>Sản phẩm khác</h2>
            <div class="luoi-goi-y" id="luoi-goi-y"></div>
        </div>
    </div>

    <script src="assets/js/order.js?v=11" defer></script>
    <script>
        (function () {
            'use strict';

            var JAVA_API = 'http://localhost:8090/api';

            var thamSo = new URLSearchParams(location.search);
            var idCanTim = (thamSo.get('id') || '').trim();
            // Link cũ dạng ?ten=...&gia=... (giỏ hàng cũ, trang đã lưu dấu) vẫn mở được
            var tenCanTim = (thamSo.get('ten') || '').trim();

            function esc(t) {
                return String(t == null ? '' : t)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            function giaVND(so) { return Number(so || 0).toLocaleString('vi-VN') + '₫'; }

            /* Hỏi backend đúng MỘT sản phẩm (kèm sẵn "sản phẩm liên quan"), không tải cả kho
               về rồi dò tên như trước. Giá sau giảm, nhãn trạng thái, có đặt được không...
               backend tính sẵn. Không có / đã ẩn -> 404. */
            var duongDan = /^\d+$/.test(idCanTim)
                ? '/cua-hang/san-pham/' + idCanTim
                : (tenCanTim ? '/cua-hang/san-pham/tim?ten=' + encodeURIComponent(tenCanTim) : '');

            var taiSanPham = !duongDan
                ? Promise.resolve(null)
                : fetch(JAVA_API + duongDan).then(function (r) {
                    if (r.status === 404) return null;
                    return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status));
                });

            // order.js nạp kiểu defer: chờ trang dựng xong (order.js đã chạy) rồi mới vẽ,
            // vì phần vẽ dùng anhChoSanPham / themVaoGioTuNgoai của order.js.
            // Còn gọi backend thì bắt đầu ngay từ đây, không phải chờ.
            var trangSanSang = new Promise(function (xong) {
                if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', xong);
                else xong();
            });

            var khung = document.getElementById('noi-dung-chinh');

            Promise.all([taiSanPham, trangSanSang]).then(function (kq) {
                if (!kq[0]) {
                    khung.innerHTML = 'Không tìm thấy sản phẩm. <a href="Home.html">Quay lại cửa hàng</a>';
                    return;
                }
                ve(kq[0]);
            }, function () {
                khung.innerHTML = 'Chưa kết nối được cửa hàng. Bạn tải lại trang sau ít phút ' +
                    'hoặc gọi 0901 234 567 nhé. <a href="Home.html">Quay lại cửa hàng</a>';
            });

            function ve(sp) {
                document.title = sp.ten + ' - IN3D Shop';
                document.getElementById('dd-ten').textContent = sp.ten;
                // Mở bằng link cũ ?ten= thì đổi địa chỉ sang ?id= cho gọn, tải lại vẫn đúng món
                if (!idCanTim && sp.id && window.history && history.replaceState) {
                    history.replaceState(null, '', location.pathname + '?id=' + encodeURIComponent(sp.id));
                }

                // Giá khách phải trả (đã trừ giảm giá sản phẩm nếu có) — cùng số với thẻ ở trang chủ.
                // Hàng mẫu không bán nên không gắn giá gốc / nhãn giảm.
                var giam = sp.coTheDat && sp.giaSauGiam != null;
                var giaHtml = esc(sp.giaHienChu) + (giam
                    ? ' <span class="gia-goc">' + giaVND(sp.giaGoc) + '</span>' +
                      ' <span class="nhan-giam">-' + esc(sp.phanTram) + '%</span>'
                    : '');

                /* Tình trạng = đúng trạng thái đặt ở trang quản trị (cùng chữ với trang
                   chủ), backend đổi sẵn ra chữ cho khách. */
                var tonKhoHtml = !sp.nhanTrangThai ? '' :
                    '<p class="ton-kho">Tình trạng: <span class="' + (sp.trangThai === 'het_hang' ? 'het' : 'con') + '">' +
                    esc(sp.nhanTrangThai) + '</span></p>';

                // Mã sản phẩm ghép từ id, đúng cách trang quản trị đang hiển thị
                var maSp = sp.id ? 'SP-' + sp.id : '';

                /* ---------- SLIDE ẢNH ----------
                   Lấy tất cả ảnh admin đã thêm (ảnh đầu = ảnh bìa). Chỉ có một ảnh thì
                   hiện ảnh tĩnh, không vẽ nút với chấm cho rối. */
                var dsAnh = (sp.danhSachAnh && sp.danhSachAnh.length ? sp.danhSachAnh : [sp.hinhAnh]).map(function (u) {
                    return anhChoSanPham(sp.ten, u);
                });
                var anhLoi = anhChoSanPham(sp.ten);
                var nhieuAnh = dsAnh.length > 1;
                var htmlSlide =
                    '<div class="slide">' +
                    '<div class="slide-khung">' + dsAnh.map(function (u, k) {
                        return '<img src="' + esc(u) + '" alt="' + esc(sp.ten) + (nhieuAnh ? ' — ảnh ' + (k + 1) : '') + '"' +
                               ' onerror="this.src=\'' + anhLoi + '\'">';
                    }).join('') + '</div>' +
                    (nhieuAnh
                        ? '<button type="button" class="slide-nut trai" aria-label="Ảnh trước">&#10094;</button>' +
                          '<button type="button" class="slide-nut phai" aria-label="Ảnh sau">&#10095;</button>' +
                          '<div class="slide-cham">' + dsAnh.map(function (u, k) {
                              return '<button type="button" aria-label="Ảnh ' + (k + 1) + '"' +
                                     (k === 0 ? ' class="dang-xem"' : '') + '></button>';
                          }).join('') + '</div>'
                        : '') +
                    '</div>' +
                    (nhieuAnh
                        ? '<div class="dai-anh">' + dsAnh.map(function (u, k) {
                              return '<img src="' + esc(u) + '" alt=""' + (k === 0 ? ' class="dang-xem"' : '') +
                                     ' onerror="this.src=\'' + anhLoi + '\'">';
                          }).join('') + '</div>'
                        : '');

                function dongTt(nhan, giaTri) {
                    if (!giaTri) return '';
                    return '<div class="dong-tt"><span class="nhan-tt">' + esc(nhan) + '</span>' +
                           '<span>' + giaTri + '</span></div>';
                }
                var thongSo =
                    dongTt('Màu', (sp.mauSac || []).map(function (m) {
                        return '<span class="chip-mau"><i style="background:' + esc(m.maMau || '#ddd') + '"></i>' +
                               esc(m.ten) + '</span>';
                    }).join(' ')) +
                    dongTt('Tồn kho', sp.tonKho ? esc(sp.tonKho) + ' sản phẩm' : '');

                khung.className = '';
                khung.innerHTML =
                    '<div class="chi-tiet">' +
                    '  <div class="anh">' + htmlSlide + '</div>' +
                    '  <div class="noi-dung">' +
                    (maSp ? '    <span class="nhan-danh-muc">Mã ' + esc(maSp) + '</span>' : '') +
                    '    <h1>' + esc(sp.ten) + '</h1>' +
                    '    <p class="gia-lon">' + giaHtml + '</p>' +
                    tonKhoHtml +
                    (sp.moTa ? '    <p class="mo-ta">' + esc(sp.moTa) + '</p>' : '') +
                    (thongSo ? '    <div class="bang-tt">' + thongSo + '</div>' : '') +
                    // Chỉ món backend cho đặt mới có nút (hàng mẫu chỉ để xem)
                    (sp.coTheDat
                        ? '    <div class="hang-nut">' +
                          '      <button class="nut nut-gio" id="nut-them-gio">🛒 Thêm vào giỏ</button>' +
                          '      <button class="nut nut-mua" id="nut-mua-ngay">Mua ngay</button>' +
                          '    </div>'
                        : '') +
                    '  </div>' +
                    '</div>';

                ganSlide(dsAnh.length);

                if (sp.coTheDat) {
                    // Giỏ lưu MÃ sản phẩm, giá do backend tính lúc xem giỏ và lúc đặt
                    document.getElementById('nut-them-gio').addEventListener('click', function () {
                        window.themVaoGioTuNgoai(sp.id, sp.ten, false);
                    });
                    document.getElementById('nut-mua-ngay').addEventListener('click', function () {
                        window.themVaoGioTuNgoai(sp.id, sp.ten, true);
                    });
                }

                // Sản phẩm liên quan: backend chọn sẵn (cùng danh mục trước), tối đa 4
                var goiY = sp.lienQuan || [];
                if (goiY.length) {
                    document.getElementById('khu-goi-y').style.display = '';
                    document.getElementById('luoi-goi-y').innerHTML = goiY.map(function (s) {
                        return '<a class="the-goi-y" href="chi-tiet.html?id=' + encodeURIComponent(s.id) + '">' +
                            '<img src="' + esc(anhChoSanPham(s.ten, s.hinhAnh)) + '" alt=""' +
                            ' onerror="this.src=\'' + anhChoSanPham(s.ten) + '\'"><div class="t">' + esc(s.ten) + '</div>' +
                            '<div class="g">' + esc(s.giaHienChu) + '</div></a>';
                    }).join('');
                }
            }

            /* Tự chạy 4 giây một ảnh; rê chuột vào thì dừng, bấm/vuốt/phím mũi tên
               để chuyển. Máy bật "giảm chuyển động" thì không tự chạy. */
            function ganSlide(soAnh) {
                if (soAnh < 2) return;
                var khungSlide = document.querySelector('.slide-khung');
                var slide = document.querySelector('.slide');
                var cham = document.querySelectorAll('.slide-cham button');
                var nho = document.querySelectorAll('.dai-anh img');
                var dai = document.querySelector('.dai-anh');
                var hienTai = 0, hen = null;

                function den(i) {
                    hienTai = (i + soAnh) % soAnh;
                    khungSlide.style.transform = 'translateX(' + (-100 * hienTai) + '%)';
                    Array.prototype.forEach.call(cham, function (c, k) { c.classList.toggle('dang-xem', k === hienTai); });
                    Array.prototype.forEach.call(nho, function (c, k) { c.classList.toggle('dang-xem', k === hienTai); });
                    // Kéo dải ảnh nhỏ cho ảnh đang xem nằm giữa — chỉ cuộn NGANG trong dải,
                    // không dùng scrollIntoView vì nó kéo cả trang lên mỗi lần tự chuyển
                    var n = nho[hienTai];
                    if (n && dai) dai.scrollLeft = n.offsetLeft - dai.clientWidth / 2 + n.clientWidth / 2;
                }
                function dung() { if (hen) { clearInterval(hen); hen = null; } }
                function tuChay() {
                    dung();
                    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                    hen = setInterval(function () { den(hienTai + 1); }, 4000);
                }

                document.querySelector('.slide-nut.trai').addEventListener('click', function () { den(hienTai - 1); tuChay(); });
                document.querySelector('.slide-nut.phai').addEventListener('click', function () { den(hienTai + 1); tuChay(); });
                Array.prototype.forEach.call(cham, function (c, k) { c.addEventListener('click', function () { den(k); tuChay(); }); });
                Array.prototype.forEach.call(nho, function (c, k) { c.addEventListener('click', function () { den(k); tuChay(); }); });
                slide.addEventListener('mouseenter', dung);
                slide.addEventListener('mouseleave', tuChay);

                // Vuốt trên điện thoại
                var x0 = null;
                slide.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; dung(); }, { passive: true });
                slide.addEventListener('touchend', function (e) {
                    if (x0 === null) return;
                    var dx = e.changedTouches[0].clientX - x0;
                    if (Math.abs(dx) > 40) den(hienTai + (dx < 0 ? 1 : -1));
                    x0 = null;
                    tuChay();
                });
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'ArrowLeft') { den(hienTai - 1); tuChay(); }
                    if (e.key === 'ArrowRight') { den(hienTai + 1); tuChay(); }
                });
                tuChay();
            }
        })();
    </script>
    <script src="assets/js/anime.js?v=1" defer></script>
</body>
</html>
